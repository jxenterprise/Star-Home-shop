<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ===========================================================
       Estrellita House — admin/index.html
       Panel de administración (Sveltia CMS, sucesor de Decap/Netlify CMS).
       Qué es: la página donde la dueña entra con GitHub para cambiar
               productos, precios, fotos, colecciones, portada y aviso.
       Depende de: admin/config.yml (se carga solo, mismo directorio) y del
                   repositorio de GitHub conectado a Cloudflare Pages.
       No se indexa en Google (noindex + Disallow en robots.txt).
       =========================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrador · Estrellita House</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Script oficial de Sveltia CMS desde su CDN. Va SIN type="module" (así lo pide su documentación). -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
